# deepwiki_to_md設定ファイル v2.0

extraction:
  strategies:
    nextjs:
      enabled: true
      priority: 1
      json_paths:
        - "props.pageProps.source.source"
        - "props.pageProps.content.markdown"
        - "props.pageProps.mdxSource.compiledSource"
    fallback:
      enabled: true
      priority: 99

network:
  timeout: 30
  retry_attempts: 3
  retry_delay: 1.0
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

output:
  format: "markdown"
  remove_first_lines: 28
  fix_links: true
  output_directory: "output"
  
logging:
  level: "INFO"
  file: "logs/deepwiki_scraper.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

validation:
  min_content_length: 100
  check_markdown_headers: true
  check_encoding: true
  check_html_artifacts: true