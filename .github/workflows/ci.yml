name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest<9; python_version < '3.9'" pytest-cov black isort flake8 mypy types-setuptools

      - name: Run tests
        run: python -m pytest

      - name: Check Black formatting
        run: python -m black --check src tests wiki_tests

      - name: Check import sorting
        run: python -m isort --check-only src tests wiki_tests

      - name: Run flake8
        run: python -m flake8 src tests wiki_tests

      - name: Run mypy
        run: python -m mypy src
